name: NutriPeer signed release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --bundles nsis
          - label: macOS Apple silicon
            platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg
          - label: macOS Intel
            platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles dmg

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Check release version matches tag
        shell: bash
        run: |
          node -e "const fs=require('node:fs'); const v=JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8')).version; if(process.env.GITHUB_REF_NAME!=='v'+v) { console.error('Tag must be v'+v); process.exit(1); }"

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm install

      - name: Import Windows signing certificate
        if: matrix.platform == 'windows-latest'
        env:
          NUTRIPEER_WINDOWS_CERTIFICATE: ${{ secrets.NUTRIPEER_WINDOWS_CERTIFICATE }}
          NUTRIPEER_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.NUTRIPEER_WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          if (-not $env:NUTRIPEER_WINDOWS_CERTIFICATE) { throw 'Missing NUTRIPEER_WINDOWS_CERTIFICATE secret.' }
          if (-not $env:NUTRIPEER_WINDOWS_CERTIFICATE_PASSWORD) { throw 'Missing NUTRIPEER_WINDOWS_CERTIFICATE_PASSWORD secret.' }
          $pfx = Join-Path $env:RUNNER_TEMP 'nutripeer-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:NUTRIPEER_WINDOWS_CERTIFICATE))
          try {
            $certs = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString $env:NUTRIPEER_WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force)
          } finally {
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
          }
          $cert = $certs | Where-Object HasPrivateKey | Select-Object -First 1
          if (-not $cert) { throw 'No private-key certificate was imported.' }
          $config = @{ bundle = @{ windows = @{ certificateThumbprint = $cert.Thumbprint; digestAlgorithm = 'sha256'; timestampUrl = 'http://timestamp.digicert.com' } } } | ConvertTo-Json -Depth 6
          Set-Content -LiteralPath 'src-tauri/tauri.windows.conf.json' -Value $config -Encoding utf8NoBOM

      - name: Import Apple Developer ID certificate
        if: startsWith(matrix.platform, 'macos-')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        shell: bash
        run: |
          test -n "$APPLE_CERTIFICATE" || { echo 'Missing APPLE_CERTIFICATE secret.'; exit 1; }
          test -n "$APPLE_CERTIFICATE_PASSWORD" || { echo 'Missing APPLE_CERTIFICATE_PASSWORD secret.'; exit 1; }
          test -n "$KEYCHAIN_PASSWORD" || { echo 'Missing KEYCHAIN_PASSWORD secret.'; exit 1; }
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/nutripeer-certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/nutripeer-build.keychain"
          security default-keychain -s "$RUNNER_TEMP/nutripeer-build.keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/nutripeer-build.keychain"
          security set-keychain-settings -t 3600 -u "$RUNNER_TEMP/nutripeer-build.keychain"
          security import "$RUNNER_TEMP/nutripeer-certificate.p12" -k "$RUNNER_TEMP/nutripeer-build.keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/nutripeer-build.keychain"
          rm -f "$RUNNER_TEMP/nutripeer-certificate.p12"
          IDENTITY=$(security find-identity -v -p codesigning "$RUNNER_TEMP/nutripeer-build.keychain" | sed -n 's/.*"\(Developer ID Application:.*\)".*/\1/p' | head -n 1)
          test -n "$IDENTITY" || { echo 'No Developer ID Application identity was found.'; exit 1; }
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Check Apple notarization credentials
        if: startsWith(matrix.platform, 'macos-')
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          test -n "$APPLE_ID" || { echo 'Missing APPLE_ID secret.'; exit 1; }
          test -n "$APPLE_APP_SPECIFIC_PASSWORD" || { echo 'Missing APPLE_APP_SPECIFIC_PASSWORD secret.'; exit 1; }
          test -n "$APPLE_TEAM_ID" || { echo 'Missing APPLE_TEAM_ID secret.'; exit 1; }

      # Pin the verified action-v1.0.0 release commit; the shorthand @v1 ref is not published.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUTRIPEER_SUPABASE_URL: ${{ secrets.NUTRIPEER_SUPABASE_URL }}
          NUTRIPEER_SUPABASE_ANON_KEY: ${{ secrets.NUTRIPEER_SUPABASE_ANON_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: .
          tagName: ${{ github.ref_name }}
          releaseName: NutriPeer ${{ github.ref_name }}
          releaseBody: Windows x64 and macOS installers. Update packages are signed by the NutriPeer updater key.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
