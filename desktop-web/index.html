<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f7f3"><link rel="icon" href="NutriPeer-Mezura.ico"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="NutriPeer-Mezura.png"><title>NutriPeer</title>
<style>
:root{--bg:#f5f7f3;--paper:#fff;--ink:#17271f;--muted:#78847c;--line:#e8ece7;--green:#2b7556;--mint:#e9f4ed;--lime:#c9eb93;--amber:#f6efdc;--red:#f8e9e7;--shadow:0 8px 28px #243b2b0b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}.side{background:#fff;border-right:1px solid var(--line);padding:25px 16px;display:flex;flex-direction:column;gap:28px}.brand{display:flex;align-items:center;gap:10px;padding:0 10px;font:800 20px Manrope}.logo{background:var(--green);color:#fff;border-radius:12px;width:36px;height:36px;display:grid;place-items:center;font-size:18px}.navlabel{font-size:10px;letter-spacing:1.1px;color:#a4ada6;padding:0 12px;margin:0 0 8px}.nav button{display:flex;align-items:center;gap:12px;width:100%;background:transparent;color:#68756c;padding:11px 12px;border-radius:10px;text-align:left;margin:3px 0}.nav button.active,.nav button:hover{background:var(--mint);color:var(--green);font-weight:700}.nav i{width:18px;font-style:normal;text-align:center}.sidefoot{margin-top:auto;padding:12px;border-radius:14px;background:#f5f7f3;font-size:12px;color:#657268}.main{min-width:0}.top{height:70px;background:#ffffffb8;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;position:sticky;top:0;z-index:3;backdrop-filter:blur(10px)}.crumb{font-size:13px;color:var(--muted)}.userbadge{display:flex;align-items:center;gap:10px;font-size:13px}.avatar{width:34px;height:34px;background:var(--lime);border-radius:50%;display:grid;place-items:center;color:#335337;font-weight:700}.content{max-width:1360px;padding:32px 36px 56px;margin:auto}.heading{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px}.heading h1{font:700 26px Manrope;margin:0 0 6px}.sub{color:var(--muted);font-size:13px}.btn{padding:10px 15px;border-radius:9px;background:var(--green);color:white;font-weight:600;font-size:13px}.btn.light{background:#fff;border:1px solid var(--line);color:var(--ink)}.btn.small{padding:7px 10px;font-size:12px}.grid{display:grid;gap:16px}.kpis{grid-template-columns:repeat(4,1fr);margin-bottom:20px}.card{background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:20px;box-shadow:var(--shadow)}.kpi{display:flex;justify-content:space-between;align-items:flex-start}.kpi label{font-size:12px;color:var(--muted)}.kpi strong{font:700 26px Manrope;display:block;margin-top:11px}.iconbox{width:34px;height:34px;background:var(--mint);color:var(--green);border-radius:10px;display:grid;place-items:center}.dashgrid{grid-template-columns:1.25fr .75fr}.cardtitle{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.cardtitle h2{font:700 16px Manrope;margin:0}.calendar-head{display:flex;align-items:center;gap:12px}.calendar-head button{background:#f5f7f3;border-radius:7px;padding:5px 9px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.calendar span{display:grid;place-items:center;min-height:39px;font-size:12px;border-radius:9px;color:#58655d}.calendar .weekday{color:#9aa39b;min-height:25px;font-size:10px;font-weight:700}.calendar .today{background:var(--green);color:white}.calendar .has{position:relative}.calendar .has:after{content:'';position:absolute;bottom:5px;width:4px;height:4px;border-radius:5px;background:#77b48f}.calendar .today:after{background:#fff}.appt{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.appt:last-child{border:0}.time{font-size:12px;color:var(--green);font-weight:700;width:42px}.apdot{width:3px;height:34px;border-radius:4px;background:var(--lime)}.appt strong{font-size:13px;display:block}.appt small{color:var(--muted)}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:680px}.table th{text-align:left;color:#97a198;font-size:10px;text-transform:uppercase;letter-spacing:.7px;padding:11px;border-bottom:1px solid var(--line)}.table td{font-size:13px;padding:13px 11px;border-bottom:1px solid #f0f2ef}.table tr:last-child td{border:0}.pill{background:var(--mint);color:var(--green);border-radius:20px;padding:5px 8px;font-size:11px}.search{padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:white;min-width:220px}.toolbar{display:flex;gap:8px;align-items:center}.split{grid-template-columns:1fr 320px}.fieldgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:#69766e;font-weight:600}.field input,.field select,.field textarea{border:1px solid var(--line);padding:10px;border-radius:8px;background:#fff;color:var(--ink);outline-color:#75a788;width:100%}.field textarea{min-height:75px;resize:vertical}.formactions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.tabs{display:flex;gap:5px;border-bottom:1px solid var(--line);margin-bottom:17px;overflow:auto}.tabs button{background:none;padding:10px;color:var(--muted);white-space:nowrap}.tabs button.on{color:var(--green);border-bottom:2px solid var(--green);font-weight:700}.statrow{display:flex;gap:10px;flex-wrap:wrap}.stat{background:#f6f8f5;border-radius:10px;padding:12px 16px;min-width:125px}.stat small{color:var(--muted);display:block}.stat b{font:700 17px Manrope}.muted{color:var(--muted)}.modalbg{position:fixed;inset:0;background:#14231c66;display:grid;place-items:center;padding:20px;z-index:10}.modal{width:min(740px,100%);max-height:90vh;overflow:auto;background:white;border-radius:17px;padding:23px;box-shadow:0 24px 90px #0003}.modal h2{font:700 19px Manrope;margin:0 0 18px}.hide{display:none!important}.toast{position:fixed;right:24px;bottom:24px;background:#1c3528;color:white;padding:12px 17px;border-radius:10px;z-index:20}.login{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;background:#fff}.loginart{background:#143d2d;color:#fff;padding:9vh 8vw;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}.loginart:after{content:'✳';font-size:430px;position:absolute;right:-70px;bottom:-140px;color:#ffffff0c}.loginart h1{font:800 44px Manrope;max-width:450px;line-height:1.14}.loginart p{color:#c6dacf;max-width:400px;line-height:1.7}.loginform{display:grid;place-items:center;padding:35px}.loginbox{width:min(390px,100%)}.loginbox h2{font:700 25px Manrope}.loginbox .field{margin:14px 0}.authswitch{display:flex;gap:18px;border-bottom:1px solid var(--line);margin:20px 0}.authswitch button{padding:10px 2px;background:none;color:var(--muted)}.authswitch button.on{border-bottom:2px solid var(--green);color:var(--green);font-weight:700}.notice{padding:11px;background:#fff8e7;color:#786630;border-radius:9px;font-size:11px;line-height:1.55;margin-top:13px}.empty{text-align:center;color:#9aa39b;padding:35px}.exchange{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.exchange .field input{text-align:center}.meal{border:1px solid var(--line);border-radius:11px;margin:9px 0;padding:12px}.meal h3{font-size:13px;margin:0 0 8px}.mealstats{font-size:11px;color:#67756a}.foodrow{display:grid;grid-template-columns:1fr 100px;gap:8px;margin:7px 0}.responsive{overflow:auto}
@media(max-width:900px){.app{grid-template-columns:70px 1fr}.side{padding:20px 8px}.brand{padding:0 8px}.brand span,.navlabel,.nav button:not(.active){font-size:0}.nav button{justify-content:center;padding:12px}.nav button i{font-size:16px}.sidefoot{display:none}.content{padding:22px 16px}.top{padding:0 16px}.dashgrid,.split{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.login{grid-template-columns:1fr}.loginart{display:none}.fieldgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.heading{gap:12px;flex-wrap:wrap}.kpis{gap:9px}.card{padding:15px}}
</style></head><body><div id="root"></div><div id="modal"></div><div id="toast" class="toast hide"></div>
<script>
const LEGACY_KEY='nutripeer.v1',LOCAL_KEY_PREFIX='nutripeer.local.v1.';let KEY=window.NUTRIPEER_COMMUNITY_CONFIG?.managed?(()=>{try{const s=JSON.parse(localStorage.getItem('nutripeer.community.auth.v1')||'null');return s?.user?.id?LOCAL_KEY_PREFIX+s.user.id:'nutripeer.desktop.pending'}catch{return 'nutripeer.desktop.pending'}})():LEGACY_KEY;const EMPTY_DB='{"users":[],"session":null,"patients":[],"appointments":[],"diets":[],"templates":[],"measurements":[],"foods":[]}';let db=JSON.parse(localStorage.getItem(KEY)||EMPTY_DB);let page='dashboard',selected=null,month=new Date(),patientTab='Özet',calcResult=null,exchanges={Süt:0,Et:0,Ekmek:0,Sebze:0,Meyve:0,Yağ:0,Kuruyemiş:0},menuMeals=4,menuItems=[],authRegistering=false;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(KEY,JSON.stringify(db))}function toast(x){$('#toast').textContent=x;$('#toast').classList.remove('hide');setTimeout(()=>$('#toast').classList.add('hide'),2400)}function id(){return crypto.randomUUID()}function age(d){if(!d)return 0;const b=new Date(d),n=new Date();return n.getFullYear()-b.getFullYear()-((n.getMonth()<b.getMonth()||n.getMonth()===b.getMonth()&&n.getDate()<b.getDate())?1:0)}function activeUser(){return db.users.find(x=>x.id===db.session)}
function render(){if(!db.session){auth();return}$('#root').innerHTML=`<div class="app"><aside class="side"><div class="brand"><div class="logo">✳</div><span>NutriPeer</span></div><div class="nav"><div class="navlabel">ÇALIŞMA ALANI</div>${[['dashboard','⌂','Genel Bakış'],['patients','♙','Danışanlarım'],['appointments','▦','Randevular'],['diets','◉','Diyetler'],['calculator','∑','Enerji Hesabı'],['foods','⌕','Besin Kütüphanesi']].map(([k,i,n])=>`<button class="${page===k?'active':''}" onclick="go('${k}')"><i>${i}</i>${n}</button>`).join('')}<div class="navlabel" style="margin-top:26px">HESAP</div><button onclick="backup()"><i>⇩</i>Yedekle</button><button onclick="logout()"><i>↗</i>Çıkış Yap</button></div><div class="sidefoot">🔒 Veriler bu cihazda saklanır.<br><br>NutriPeer • Klinik çalışma alanı</div></aside><main class="main"><header class="top"><div class="crumb">NutriPeer &nbsp; / &nbsp; ${pageName()}</div><div class="userbadge"><div class="avatar">${esc(activeUser()?.first[0]||'D')}</div>${esc(activeUser()?.first||'Diyetisyen')} ${esc(activeUser()?.last||'')}</div></header><section class="content" id="view"></section></main></div>`;views[page]();}
function pageName(){return ({dashboard:'Genel Bakış',patients:'Danışanlarım',appointments:'Randevular',diets:'Diyetler',calculator:'Enerji Hesabı',foods:'Besin Kütüphanesi',profile:'Danışan Dosyası'})[page]||'Genel Bakış'}function go(p){page=p;render()}function auth(){let registering=authRegistering;window.authMode=x=>{authRegistering=x;auth()};$('#root').innerHTML=`<div class="login"><div class="loginart"><div class="brand"><div class="logo">✳</div>NutriPeer</div><div><h1>İyi beslenme, iyi takip ile başlar.</h1><p>Danışanlarınızı, ölçümlerinizi ve beslenme planlarınızı tek bir sakin çalışma alanında yönetin.</p></div><small>NutriPeer • Diyetisyen çalışma alanı</small></div><div class="loginform"><form class="loginbox" onsubmit="authSubmit(event,${registering})"><h2>${registering?'Hesap oluştur':'Tekrar hoş geldiniz'}</h2><div class="sub">${registering?'Adınızı ve şifrenizi belirleyin.':'E-posta veya ad soyadınızla giriş yapın.'}</div><div class="authswitch"><button type="button" class="${!registering?'on':''}" onclick="authMode(false)">Giriş Yap</button><button type="button" class="${registering?'on':''}" onclick="authMode(true)">Kayıt Ol</button></div><div class="fieldgrid">${registering?`<div class="field full"><label>Ad Soyad</label><input name="fullname" required autocomplete="name"></div><div class="field full"><label>E-posta (isteğe bağlı)</label><input name="email" type="email" autocomplete="email"></div>`:`<div class="field full"><label>E-posta veya Ad Soyad</label><input name="identity" required autocomplete="username"></div>`}<div class="field full"><label>Şifre (en az 8 karakter)</label><input name="password" type="password" required minlength="8" autocomplete="${registering?'new-password':'current-password'}"></div></div><button class="btn" style="width:100%;margin-top:17px">${registering?'Hesap Oluştur':'Giriş Yap'}</button><div class="notice">Hesap ve danışan kayıtları bu bilgisayarda saklanır. Hesap açmak için yalnızca ad soyad ve şifre gerekir.</div></form></div></div>`}
async function hash(p){if(!globalThis.crypto?.subtle)throw new Error('Bu uygulama güvenli parola kaydını başlatamadı. Uygulamayı güncel masaüstü sürümünden açın.');const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}async function authSubmit(e,reg){e.preventDefault();const form=e.target, f=Object.fromEntries(new FormData(form));const button=form.querySelector('button[type="submit"],button:not([type])');if(button){button.disabled=true;button.textContent='Bekleyin…'}try{const h=await hash(f.password);if(reg){const fullname=f.fullname.trim().replace(/\s+/g,' '),parts=fullname.split(' '),first=parts.shift(),last=parts.join(' ');if(!first||!last)return toast('Lütfen adınızı ve soyadınızı birlikte yazın.');const email=(f.email||'').trim().toLowerCase();if(db.users.some(x=>(email&&x.email?.toLowerCase()===email)||(`${x.first||''} ${x.last||''}`).trim().toLowerCase()===fullname.toLowerCase()))return toast('Bu ad veya e-posta ile hesap zaten var. Giriş yapmayı deneyin.');const u={id:id(),first,last,email,hash:h};db.users.push(u);db.session=u.id;save();render();toast('Hesabınız oluşturuldu.')}else{const identity=f.identity.trim().toLowerCase();const matches=db.users.filter(x=>((x.email||'').toLowerCase()===identity||(`${x.first||''} ${x.last||''}`).trim().toLowerCase()===identity)&&x.hash===h);if(matches.length!==1)return toast('Hesap bulunamadı. İlk kullanımda Kayıt Ol bölümünden hesap oluşturun; mevcut hesabınızda e-posta veya kayıtlı ad soyadı ve şifreyi kullanın.');db.session=matches[0].id;save();render()}}catch(error){console.error('NutriPeer account setup failed:',error);toast(error.message||'Hesap açılamadı. Bilgileri kontrol edip tekrar deneyin.')}finally{if(button&&button.isConnected){button.disabled=false;button.textContent=reg?'Hesap Oluştur':'Giriş Yap'}}}function logout(){db.session=null;save();render()}
const views={dashboard:dashboard,patients:patients,appointments:appointments,diets:diets,calculator:calculator,foods:foods,profile:profile};function dashboard(){let v=$('#view'),now=new Date(),first=new Date(month.getFullYear(),month.getMonth(),1),days=new Date(month.getFullYear(),month.getMonth()+1,0).getDate(),offset=(first.getDay()+6)%7;let ap=db.appointments.filter(a=>a.date===iso(now)),total=db.appointments.filter(a=>a.date?.slice(0,7)===isoMonth(now)).length;v.innerHTML=`<div class="heading"><div><h1>Kliniğe hoş geldin, ${esc(activeUser().first)} 🌱</h1><div class="sub">Kliniğinizin bugünkü özeti ve yaklaşan randevular.</div></div><button class="btn" onclick="appointmentForm()">＋ Yeni Randevu</button></div><div class="grid kpis">${[['♙','Danışan Sayısı',db.patients.length],['▦','Randevu Sayısı',total],['◉','Diyet Planı Sayısı',db.diets.length],['⌁','Ölçüm Sayısı',db.measurements.length]].map(([i,n,x])=>`<div class="card kpi"><div><label>${n}</label><strong>${x}</strong></div><span class="iconbox">${i}</span></div>`).join('')}</div><div class="grid dashgrid"><div class="card"><div class="cardtitle"><h2>Aylık Takvim</h2><div class="calendar-head"><button onclick="shiftMonth(-1)">‹</button><b>${month.toLocaleDateString('tr-TR',{month:'long',year:'numeric'})}</b><button onclick="shiftMonth(1)">›</button></div></div><div class="calendar">${['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'].map(x=>`<span class="weekday">${x}</span>`).join('')}${Array.from({length:offset},()=>'<span></span>').join('')}${Array.from({length:days},(_,i)=>{let d=new Date(month.getFullYear(),month.getMonth(),i+1),key=iso(d),has=db.appointments.some(a=>a.date===key),today=iso(new Date())===key;return `<span class="${today?'today ':''}${has?'has':''}" onclick="showDay('${key}')" style="cursor:pointer">${i+1}</span>`}).join('')}</div><div class="sub" style="margin-top:12px">Bir güne tıklayarak randevuları görüntüleyin.</div></div><div class="card"><div class="cardtitle"><h2>Bugünkü Randevular</h2><button class="btn light small" onclick="go('appointments')">Tümünü Gör</button></div>${ap.length?ap.sort((a,b)=>a.time.localeCompare(b.time)).map(a=>`<div class="appt"><div class="time">${esc(a.time)}</div><div class="apdot"></div><div><strong>${esc(a.name)}</strong><small>${esc(a.type||'Kontrol')} · ${esc(a.duration||30)} dk</small></div></div>`).join(''):'<div class="empty">Bugün için randevu yok.</div>'}</div></div><div class="card" style="margin-top:17px"><div class="cardtitle"><h2>Son Eklenen Danışanlar</h2><button class="btn light small" onclick="go('patients')">Danışanları Gör</button></div>${patientRows(db.patients.slice(-5).reverse())}</div>`}function iso(d){return d.toISOString().slice(0,10)}function isoMonth(d){return iso(d).slice(0,7)}function shiftMonth(n){month.setMonth(month.getMonth()+n);dashboard()}function showDay(d){let as=db.appointments.filter(a=>a.date===d);modal(`<h2>${new Date(d+'T12:00').toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})} · ${as.length} randevu</h2>${as.length?as.map(a=>`<div class="appt"><div class="time">${esc(a.time)}</div><div class="apdot"></div><div><strong>${esc(a.name)}</strong><small>${esc(a.type)} · ${esc(a.duration)} dk ${a.note?'· '+esc(a.note):''}</small></div></div>`).join(''):'<div class="empty">Bu tarihte randevu bulunmuyor.</div>'}<div class="formactions"><button class="btn light" onclick="closeModal()">Kapat</button><button class="btn" onclick="closeModal();appointmentForm('${d}')">＋ Randevu Ekle</button></div>`)}
function patientRows(items){return items.length?`<div class="tablewrap"><table class="table"><thead><tr><th>Danışan</th><th>Telefon</th><th>Yaş</th><th>Son Kilo</th><th>Hedef</th></tr></thead><tbody>${items.map(p=>`<tr onclick="openPatient('${p.id}')" style="cursor:pointer"><td><b>${esc(p.first)} ${esc(p.last)}</b></td><td>${esc(p.phone)}</td><td>${age(p.birth)||'—'}</td><td>${p.weight?esc(p.weight)+' kg':'—'}</td><td><span class="pill">Dosyayı aç →</span></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Henüz danışan kaydı yok.</div>'}
function patients(){let q='';$('#view').innerHTML=`<div class="heading"><div><h1>Danışanlarım</h1><div class="sub">Danışan kayıtları ve kişisel dosyaları.</div></div><div class="toolbar"><input class="search" id="pq" placeholder="İsim veya telefon ara" oninput="filterPatients(this.value)"><button class="btn" onclick="patientForm()">＋ Yeni Danışan</button></div></div><div class="card" id="patienttable">${patientRows(db.patients)}</div>`}function filterPatients(q){let items=db.patients.filter(p=>(p.first+' '+p.last+' '+p.phone).toLowerCase().includes(q.toLowerCase()));$('#patienttable').innerHTML=patientRows(items)}
const patientFields=[['first','Ad','text',1],['last','Soyad','text',1],['phone','Telefon','tel',1],['sex','Cinsiyet','select',1,['Kadın','Erkek','Diğer']],['birth','Doğum Tarihi','date',1],['profession','Meslek','text',0],['height','Boy (cm)','number',0],['weight','Kilo (kg)','number',0],['activity','Aktivite Düzeyi','select',0,['Hareketsiz','Az aktif','Orta aktif','Aktif','Çok aktif']],['diagnoses','Tanılar','textarea',0],['medications','İlaçlar','textarea',0],['allergies','Alerjiler / intoleranslar','textarea',0],['history','Beslenme Öyküsü','textarea',0],['notes','Genel Notlar','textarea',0]];
function formFields(fields,values={}){return fields.map(([key,label,type,req,options])=>`<div class="field ${type==='textarea'?'full':''}"><label>${label}${req?' *':''}</label>${type==='select'?`<select name="${key}" ${req?'required':''}><option value="">Seçin</option>${options.map(o=>`<option ${values[key]===o?'selected':''}>${o}</option>`).join('')}</select>`:type==='textarea'?`<textarea name="${key}">${esc(values[key]||'')}</textarea>`:`<input name="${key}" type="${type}" ${req?'required':''} value="${esc(values[key]||'')}" ${type==='number'?'step="any" min="0"':''}>`}</div>`).join('')}
function patientForm(pid){let p=db.patients.find(x=>x.id===pid)||{};modal(`<h2>${pid?'Danışan Bilgilerini Düzenle':'Yeni Danışan'}</h2><form onsubmit="savePatient(event,'${pid||''}')"><div class="fieldgrid">${formFields(patientFields,p)}</div><div class="formactions"><button type="button" class="btn light" onclick="closeModal()">İptal</button><button class="btn">Kaydet</button></div></form>`)}function savePatient(e,pid){e.preventDefault();let o=Object.fromEntries(new FormData(e.target)),p=db.patients.find(x=>x.id===pid);if(p)Object.assign(p,o);else db.patients.push({...o,id:id(),created:new Date().toISOString()});save();closeModal();render();toast('Danışan dosyası kaydedildi.')}function openPatient(pid){selected=db.patients.find(p=>p.id===pid);page='profile';render()}
function profile(){let p=selected||db.patients[0];if(!p){page='patients';return render()}let v=$('#view'),meas=db.measurements.filter(x=>x.patient===p.id),ap=db.appointments.filter(x=>x.patient===p.id),di=db.diets.filter(x=>x.patient===p.id);v.innerHTML=`<div class="heading"><div><button class="btn light small" onclick="go('patients')">← Danışanlar</button><h1 style="margin-top:13px">${esc(p.first)} ${esc(p.last)}</h1><div class="sub">Danışan dosyası · ${esc(p.phone)}</div></div><div class="toolbar"><button class="btn light" onclick="patientForm('${p.id}')">Düzenle</button><button class="btn" onclick="calcPatient('${p.id}')">∑ Enerji Hesabı</button></div></div><div class="tabs">${['Özet','Ölçümler','Diyet Geçmişi','Randevular','Notlar'].map(t=>`<button class="${patientTab===t?'on':''}" onclick="patientTab='${t}';profile()">${t}</button>`).join('')}</div><div id="ptab"></div>`;let t=$('#ptab');if(patientTab==='Özet')t.innerHTML=`<div class="statrow">${[['Yaş',age(p.birth)?age(p.birth)+' yaş':'—'],['Boy',p.height?p.height+' cm':'—'],['Son Kilo',p.weight?p.weight+' kg':'—'],['VKİ',p.height&&p.weight?(p.weight/(p.height/100)**2).toFixed(1):'—']].map(([x,y])=>`<div class="stat"><small>${x}</small><b>${y}</b></div>`).join('')}</div><div class="grid dashgrid" style="margin-top:17px"><div class="card"><div class="cardtitle"><h2>Klinik Bilgiler</h2><button class="btn light small" onclick="patientForm('${p.id}')">Düzenle</button></div>${[['Cinsiyet',p.sex],['Meslek',p.profession],['Aktivite Düzeyi',p.activity],['Tanılar',p.diagnoses],['İlaçlar',p.medications],['Alerjiler',p.allergies],['Beslenme Öyküsü',p.history],['Genel Notlar',p.notes]].map(([x,y])=>`<p style="font-size:13px"><b>${x}</b><br><span class="muted">${esc(y)||'—'}</span></p>`).join('')}</div><div class="card"><div class="cardtitle"><h2>Dosya Özeti</h2></div><p class="sub">${meas.length} ölçüm · ${di.length} diyet planı · ${ap.length} randevu</p><button class="btn light" onclick="measurementForm('${p.id}')">＋ Ölçüm Ekle</button></div></div>`;if(patientTab==='Ölçümler')t.innerHTML=`<div class="card"><div class="cardtitle"><h2>Ölçüm Geçmişi</h2><button class="btn" onclick="measurementForm('${p.id}')">＋ Ölçüm Ekle</button></div>${measurementRows(meas)}</div>`;if(patientTab==='Diyet Geçmişi')t.innerHTML=`<div class="card"><div class="cardtitle"><h2>Diyet Planları</h2><button class="btn" onclick="newDiet('${p.id}')">＋ Plan Oluştur</button></div>${dietRows(di)}</div>`;if(patientTab==='Randevular')t.innerHTML=`<div class="card"><div class="cardtitle"><h2>Randevu Geçmişi</h2><button class="btn" onclick="appointmentForm('',p.id)">＋ Randevu</button></div>${appointmentRows(ap)}</div>`;if(patientTab==='Notlar')t.innerHTML=`<div class="card"><button class="btn light" onclick="patientForm('${p.id}')">Notları ve klinik bilgileri düzenle</button><p>${esc(p.notes)||'Henüz not eklenmedi.'}</p></div>`}
function measurementRows(a){return a.length?`<div class="tablewrap"><table class="table"><tr><th>Tarih</th><th>Kilo</th><th>Bel</th><th>Kalça</th><th>Yağ %</th><th>Kas kütlesi</th><th>Not</th></tr>${a.sort((x,y)=>y.date.localeCompare(x.date)).map(x=>`<tr><td>${esc(x.date)}</td><td>${x.weight||'—'}</td><td>${x.waist||'—'}</td><td>${x.hip||'—'}</td><td>${x.fat||'—'}</td><td>${x.muscle||'—'}</td><td>${esc(x.note)}</td></tr>`).join('')}</table></div>`:'<div class="empty">Ölçüm yok.</div>'}function measurementForm(pid){modal(`<h2>Ölçüm Ekle</h2><form onsubmit="saveMeasurement(event,'${pid}')"><div class="fieldgrid">${formFields([['date','Tarih','date',1],['weight','Kilo (kg)','number'],['waist','Bel (cm)','number'],['hip','Kalça (cm)','number'],['fat','Yağ oranı (%)','number'],['muscle','Kas kütlesi (kg)','number'],['note','Not','textarea']],{date:iso(new Date())})}</div><div class="formactions"><button type="button" class="btn light" onclick="closeModal()">İptal</button><button class="btn">Kaydet</button></div></form>`)}function saveMeasurement(e,pid){e.preventDefault();let o=Object.fromEntries(new FormData(e.target));db.measurements.push({...o,id:id(),patient:pid});if(o.weight){let p=db.patients.find(x=>x.id===pid);p.weight=o.weight}save();closeModal();render();toast('Ölçüm kaydedildi.')}
function appointmentRows(a){return a.length?`<div class="tablewrap"><table class="table"><tr><th>Tarih</th><th>Saat</th><th>Danışan</th><th>Tür</th><th>Süre</th><th>Not</th><th></th></tr>${a.sort((x,y)=>(y.date+y.time).localeCompare(x.date+x.time)).map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.time)}</td><td>${esc(x.name)}</td><td>${esc(x.type)}</td><td>${esc(x.duration)} dk</td><td>${esc(x.note)}</td><td><button class="btn light small" onclick="del('appointments','${x.id}')">Sil</button></td></tr>`).join('')}</table></div>`:'<div class="empty">Randevu yok.</div>'}function appointments(){let v=$('#view');v.innerHTML=`<div class="heading"><div><h1>Randevular</h1><div class="sub">Randevu takvimi ve geçmiş kayıtlar.</div></div><button class="btn" onclick="appointmentForm()">＋ Yeni Randevu</button></div><div class="card">${appointmentRows(db.appointments)}</div>`}function appointmentForm(date='',pid=''){let p=db.patients.find(x=>x.id===pid);modal(`<h2>Yeni Randevu</h2><form onsubmit="saveAppointment(event,'${pid}')"><div class="fieldgrid"><div class="field"><label>Danışan *</label><select name="patient" required><option value="">Seçin</option>${db.patients.map(x=>`<option value="${x.id}" ${pid===x.id?'selected':''}>${esc(x.first)} ${esc(x.last)}</option>`).join('')}</select></div><div class="field"><label>Tarih *</label><input name="date" type="date" required value="${date||iso(new Date())}"></div><div class="field"><label>Saat *</label><input name="time" type="time" required></div><div class="field"><label>Görüşme türü</label><select name="type"><option>Kontrol</option><option>İlk görüşme</option><option>Online görüşme</option></select></div><div class="field"><label>Süre (dk)</label><input name="duration" type="number" value="30" min="5"></div><div class="field full"><label>Not</label><textarea name="note"></textarea></div></div><div class="formactions"><button type="button" class="btn light" onclick="closeModal()">İptal</button><button class="btn">Kaydet</button></div></form>`)}function saveAppointment(e){e.preventDefault();let o=Object.fromEntries(new FormData(e.target)),p=db.patients.find(x=>x.id===o.patient);db.appointments.push({...o,id:id(),name:p.first+' '+p.last});save();closeModal();render();toast('Randevu kaydedildi.')}

const macro={Süt:[9,6,6],Et:[0,6,5],Ekmek:[15,2,0],Sebze:[6,2,0],Meyve:[15,0,0],Yağ:[0,0,5],Kuruyemiş:[0,2,5]},kcal=m=>m[0]*4+m[1]*4+m[2]*9;function exchangeTotals(ex=exchanges){let m=[0,0,0];Object.entries(ex).forEach(([k,n])=>macro[k].forEach((x,i)=>m[i]+=x*(+n||0)));return {m,k:kcal(m)}}function energyBreak(k){let e=exchangeTotals().k||1;return [Math.round(k*0),0]}
function calculator(){let v=$('#view');v.innerHTML=`<div class="heading"><div><h1>Enerji Hesabı</h1><div class="sub">Denklemleri karşılaştırın, klinik değerlendirmeyle uygun bazal formülü seçin.</div></div></div><div class="grid split"><div><div class="card"><div class="cardtitle"><h2>Danışan ve değerlendirme girdileri</h2></div><div class="fieldgrid"><div class="field"><label>Danışan</label><select id="cp" onchange="calcAutofill()"><option value="">Manuel giriş</option>${db.patients.map(p=>`<option value="${p.id}">${esc(p.first)} ${esc(p.last)}</option>`).join('')}</select></div><div class="field"><label>Cinsiyet</label><select id="sex"><option>Kadın</option><option>Erkek</option></select></div><div class="field"><label>Yaş (yıl)</label><input id="age" type="number" min="1"></div><div class="field"><label>Boy (cm)</label><input id="height" type="number" min="1"></div><div class="field"><label>Mevcut kilo (kg)</label><input id="weight" type="number" min="1" step=".1"></div><div class="field"><label>Yağsız kütle (kg) · Cunningham</label><input id="ffm" type="number" min="1" step=".1"></div><div class="field"><label>Aktivite çarpanı (alt sınır)</label><input id="actmin" type="number" step=".01" value="1.2"></div><div class="field"><label>Aktivite çarpanı (üst sınır)</label><input id="actmax" type="number" step=".01" value="1.4"></div><div class="field"><label>Stres / hastalık çarpanı</label><input id="stress" type="number" step=".01" value="1"></div><div class="field"><label>Termik etki (%)</label><input id="tef" type="number" step="1" min="0" max="30" value="0"></div><div class="field"><label>Hesaplama ağırlığı</label><select id="basis"><option value="current">Mevcut kilo</option><option value="ideal">İdeal kilo</option><option value="adjusted">Düzeltilmiş kilo</option></select></div></div><div class="formactions"><button class="btn" onclick="runCalc()">Hesaplamaları Göster</button></div></div><div class="card" id="calcresult" style="margin-top:15px">${calcResult||'<div class="empty">Girdileri tamamlayıp hesaplamayı başlatın.</div>'}</div></div><div><div class="card"><h2 style="font:700 16px Manrope">Otomatik antropometri</h2><div id="anthro" class="statrow" style="margin-top:15px"><div class="stat"><small>VKİ</small><b>—</b></div></div><p class="sub" style="line-height:1.6">İdeal kilo: VKİ 22 × boy². Düzeltilmiş kilo: ideal + 0,25 × (mevcut − ideal). Formüller klinik araçtır; tedavi kararı yerine geçmez.</p></div><div class="card" style="margin-top:14px"><h2 style="font:700 15px Manrope">Denklemler</h2><p class="sub" style="line-height:1.65">Mifflin–St Jeor (1990), Harris–Benedict revize (Roza & Shizgal, 1984), Schofield (1985), Cunningham (1980). Yetişkin denklemleri için yaş, boy cm ve kilo kg kullanılır. Çarpanlar denklemin REE çıktısına uygulanır; termik etki ayrıca eklenir.</p></div></div></div>`}function calcPatient(pid){go('calculator');$('#cp').value=pid;calcAutofill()}function calcAutofill(){let p=db.patients.find(x=>x.id===$('#cp').value);if(!p)return;$('#sex').value=p.sex||'Kadın';$('#age').value=age(p.birth)||'';$('#height').value=p.height||'';$('#weight').value=p.weight||'';runAnthro()}function runAnthro(){let h=+$('#height').value/100,w=+$('#weight').value;if(h&&w){let ideal=22*h*h,adjusted=ideal+.25*(w-ideal);$('#anthro').innerHTML=`<div class="stat"><small>VKİ</small><b>${(w/h**2).toFixed(1)}</b></div><div class="stat"><small>İdeal kilo (VKİ 22)</small><b>${ideal.toFixed(1)} kg</b></div><div class="stat"><small>Düzeltilmiş kilo (25%)</small><b>${adjusted.toFixed(1)} kg</b></div>`;return {ideal,adjusted}}return null}function runCalc(){let sex=$('#sex').value==='Kadın'?'f':'m',a=+$('#age').value,h=+$('#height').value,w=+$('#weight').value,ffm=+$('#ffm').value,anc=runAnthro();if(!a||!h||!w||!anc)return toast('Yaş, boy ve kilo için geçerli değer girin.');let amin=+$('#actmin').value,amax=+$('#actmax').value,stress=+$('#stress').value,tef=+$('#tef').value/100;if(amin<=0||amax<amin||stress<=0||tef<0||tef>.3)return toast('Aktivite alt/üst sınırlarını ve çarpanları kontrol edin.');let basis=$('#basis').value,bw=basis==='ideal'?anc.ideal:basis==='adjusted'?anc.adjusted:w,gender=sex==='f'?-161:5;let eq=[['Mifflin–St Jeor',10*bw+6.25*h-5*a+gender],['Harris–Benedict (revize)',sex==='f'?447.593+9.247*bw+3.098*h-4.330*a:88.362+13.397*bw+4.799*h-5.677*a],['Schofield (18–30)',sex==='f'?14.818*bw+486.6:15.057*bw+692.2],['Cunningham',ffm?500+22*ffm:null]];let mult=(1+tef)*stress;let result=`<div class="cardtitle"><h2>Formül sonuçları</h2><span class="pill">${basis==='current'?'Mevcut':basis==='ideal'?'İdeal':'Düzeltilmiş'} kilo: ${bw.toFixed(1)} kg</span></div><div class="tablewrap"><table class="table"><tr><th>Denklem · bazal</th><th>Enerji aralığı</th></tr>${eq.map(([n,b])=>`<tr><td>${n}<br><small class="muted">${b?Math.round(b)+' kcal/gün bazal':'Yağsız kütle girilmedi'}</small></td><td>${b?`${Math.round(b*amin*mult)} – ${Math.round(b*amax*mult)} kcal/gün`:'—'}</td></tr>`).join('')}</table></div><p class="sub" style="margin-top:14px">Aralık = bazal × aktivite alt/üst sınırı × stres çarpanı × (1 + termik etki). Seçilen baz: ${bw.toFixed(1)} kg.</p><div class="field" style="max-width:300px;margin-top:12px"><label>Kullanılacak denklem</label><select id="chosenEq">${eq.filter(x=>x[1]).map(x=>`<option>${x[0]}</option>`).join('')}</select></div><button class="btn" style="margin-top:12px" onclick="applyCalc()">Seçili denklemi kullan ve diyet yaz</button>`;calcResult=result;$('#calcresult').innerHTML=result}function applyCalc(){const ageY=+$('#age').value,height=+$('#height').value,current=+$('#weight').value,ffm=+$('#ffm').value,sex=$('#sex').value==='Kadın',basis=$('#basis').value,ideal=22*(height/100)**2,adjusted=ideal+.25*(current-ideal),weight=basis==='ideal'?ideal:basis==='adjusted'?adjusted:current,activityMin=+$('#actmin').value,activityMax=+$('#actmax').value,stress=+$('#stress').value,tef=+$('#tef').value/100,eqName=$('#chosenEq')?.value;if(!ageY||!height||!current||!eqName||!Number.isFinite(weight))return toast('Önce geçerli yaş, boy, kilo ve denklem girin.');if(activityMin<=0||activityMax<activityMin||stress<=0||tef<0||tef>.3)return toast('Aktivite alt/üst sınırlarını ve çarpanları kontrol edin.');if(eqName==='Cunningham'&&(!ffm||ffm>current))return toast('Cunningham için mevcut kilodan büyük olmayan yağsız kütleyi girin.');const gender=sex?-161:5,values={'Mifflin–St Jeor':10*weight+6.25*height-5*ageY+gender,'Harris–Benedict (revize)':sex?447.593+9.247*weight+3.098*height-4.330*ageY:88.362+13.397*weight+4.799*height-5.677*ageY,'Schofield (18–30)':sex?14.818*weight+486.6:15.057*weight+692.2,'Cunningham':500+22*ffm},base=values[eqName];if(!Number.isFinite(base)||base<=0)return toast('Seçilen denklem için hesaplama yapılamadı. Girdileri kontrol edin.');const factor=stress*(1+tef),min=Math.round(base*activityMin*factor),max=Math.round(base*activityMax*factor);if(!Number.isFinite(min)||!Number.isFinite(max))return toast('Enerji sonucu hesaplanamadı. Girdileri kontrol edin.');newDiet(db.patients.find(p=>p.id===$('#cp').value)?.id||'',{min,max,eq:eqName,basis,weight:+weight.toFixed(1)})}
function dietRows(a){return a.length?`<div class="tablewrap"><table class="table"><tr><th>Plan</th><th>Tarih</th><th>Enerji</th><th>Danışan</th><th></th></tr>${a.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.date)}</td><td>${Number.isFinite(Number(x.kcal))?Math.round(Number(x.kcal))+' kcal':'—'}</td><td>${esc(db.patients.find(p=>p.id===x.patient)?.first||'')}</td><td><button class="btn light small" onclick="viewDiet('${x.id}')">Aç</button></td></tr>`).join('')}</table></div>`:'<div class="empty">Henüz diyet planı yok.</div>'}function diets(){let v=$('#view');v.innerHTML=`<div class="heading"><div><h1>Diyetler</h1><div class="sub">Hazır plan şablonları ve danışanlara yazılmış planlar.</div></div><button class="btn" onclick="newDiet('')">＋ Yeni Şablon</button></div><div class="grid dashgrid"><div class="card"><div class="cardtitle"><h2>Hazır Şablonlar</h2></div>${db.templates.length?db.templates.map(t=>`<div class="appt"><div class="apdot"></div><div style="flex:1"><strong>${esc(t.name)}</strong><small>${t.kcal} kcal · ${esc(t.note||'')}</small></div><button class="btn light small" onclick="newDiet('',null,'${t.id}')">Kopyala</button><button class="btn light small" onclick="editTemplate('${t.id}')">Düzenle</button></div>`).join(''):'<div class="empty">Henüz şablon oluşturulmadı.</div>'}</div><div class="card"><div class="cardtitle"><h2>Planlama özeti</h2></div><p class="sub">Şablonlar hazır başlangıç planlarıdır. Danışan dosyalarındaki planlar klinik geçmişte tutulur.</p><div class="stat"><small>Danışan planı</small><b>${db.diets.length}</b></div><div class="stat" style="margin-top:9px"><small>Hazır şablon</small><b>${db.templates.length}</b></div></div></div><div class="card" style="margin-top:16px"><div class="cardtitle"><h2>Son danışan planları</h2></div>${dietRows(db.diets.slice().reverse())}</div>`}
function newDiet(pid='',energy=null,tid=''){let template=db.templates.find(t=>t.id===tid),edit=template;let initial=edit?.ex||exchanges;exchanges={...initial};let p=db.patients.find(x=>x.id===pid),energyHint=energy?`Önerilen günlük enerji aralığı: ${energy.min}–${energy.max} kcal (${energy.eq})`:'';modal(`<h2>${pid?'Danışan için diyet planı':edit?'Şablondan plan oluştur':'Yeni şablon'}</h2><form onsubmit="saveDiet(event,'${pid}','${tid}')"><div class="fieldgrid"><div class="field"><label>Plan adı *</label><input name="name" required value="${esc(edit?.name||'')}"></div><div class="field"><label>Danışan</label><select name="patient"><option value="">Şablon olarak kaydet</option>${db.patients.map(x=>`<option value="${x.id}" ${pid===x.id?'selected':''}>${esc(x.first)} ${esc(x.last)}</option>`).join('')}</select></div><div class="field full"><label>Not / dönem</label><input name="note" placeholder="Örn. 1. hafta, kontrol dönemi" value="${esc(edit?.note||'')}"></div></div><p class="sub">${energyHint}</p><h3 style="font-size:13px">Değişim adetleri</h3><div class="exchange">${Object.keys(macro).map(k=>`<div class="field"><label>${k}<br><span class="muted">${macro[k].join('/')}</span></label><input type="number" min="0" step=".5" value="${initial[k]||0}" oninput="exchanges['${k}']=+this.value;updateExchange()" id="ex-${k}"></div>`).join('')}</div><div class="statrow" id="extot" style="margin-top:14px"></div><div style="margin-top:18px"><h3 style="font-size:13px">Öğünlere dağıtım</h3><div class="field" style="max-width:220px"><label>Öğün ve ara öğün sayısı</label><select id="mealN" onchange="menuMeals=+this.value;renderMeals()">${[3,4,5,6].map(n=>`<option ${n===menuMeals?'selected':''}>${n}</option>`).join('')}</select></div><div id="meals"></div></div><div class="formactions"><button type="button" class="btn light" onclick="closeModal()">İptal</button><button class="btn">Kaydet</button></div></form>`);updateExchange();renderMeals()}function updateExchange(){let {m,k}=exchangeTotals();let el=$('#extot');if(el)el.innerHTML=`<div class="stat"><small>Enerji</small><b>${k} kcal</b></div><div class="stat"><small>Karbonhidrat</small><b>${m[0]} g · ${Math.round(m[0]*4/k*100||0)}%</b></div><div class="stat"><small>Protein</small><b>${m[1]} g · ${Math.round(m[1]*4/k*100||0)}%</b></div><div class="stat"><small>Yağ</small><b>${m[2]} g · ${Math.round(m[2]*9/k*100||0)}%</b></div><div class="stat"><small>Toplam KH + P + Y enerji</small><b>${m[0]*4+m[1]*4+m[2]*9} kcal</b></div>`}function renderMeals(){let el=$('#meals');if(!el)return;let n=menuMeals||4;el.innerHTML=Array.from({length:n},(_,i)=>`<div class="meal"><h3>${['Kahvaltı','Ara Öğün 1','Öğle','Ara Öğün 2','Akşam','Ara Öğün 3'][i]||'Öğün '+(i+1)}</h3><div class="mealstats">Plan toplamının yaklaşık ${Math.round(100/n)}% payı · öğün besin eklemek için Besin Kütüphanesi bölümünden seçin</div></div>`).join('')}
function saveDiet(e,pid,tid){e.preventDefault();let o=Object.fromEntries(new FormData(e.target)),{m,k}=exchangeTotals(),who=o.patient||pid;if(!who){let t={id:tid||id(),name:o.name,note:o.note,kcal:k,ex:{...exchanges},macros:m};let old=db.templates.find(x=>x.id===tid);old?Object.assign(old,t):db.templates.push(t);save();closeModal();render();toast('Şablon kaydedildi.');return}let d={id:id(),patient:who,name:o.name,note:o.note,date:iso(new Date()),kcal:k,macros:m,ex:{...exchanges}};db.diets.push(d);save();closeModal();if(page==='profile'){patientTab='Diyet Geçmişi';profile()}else render();toast('Diyet planı danışan dosyasına kaydedildi.')}function editTemplate(tid){newDiet('',null,tid)}function viewDiet(did){let d=db.diets.find(x=>x.id===did);modal(`<h2>${esc(d.name)}</h2><p class="sub">${d.date} · ${Number.isFinite(Number(d.kcal))?Math.round(Number(d.kcal))+' kcal':'Enerji bilgisi yok'} · KH ${d.macros[0]}g · Protein ${d.macros[1]}g · Yağ ${d.macros[2]}g</p><div class="statrow">${Object.entries(d.ex).map(([k,n])=>`<div class="stat"><small>${k} değişimi</small><b>${n}</b></div>`).join('')}</div><div class="formactions"><button class="btn light" onclick="closeModal()">Kapat</button><button class="btn" onclick="closeModal();newDiet('${d.patient}')">Yeni plan oluştur</button></div>`)}
const foodsSeed=[['Süzme peynir',100,12,10,5],['Lor peyniri',100,3,18,5],['Beyaz peynir',100,2,14,20],['Yarım yağlı süt',100,5,3.3,1.5],['Yoğurt, sade',100,4.7,3.5,3.3],['Yumurta, bütün',100,.7,12.6,10.6],['Tavuk göğsü, pişmiş',100,0,31,3.6],['Yulaf',100,66,17,7],['Tam buğday ekmeği',100,43,9,4],['Pirinç, pişmiş',100,28,2.7,.3],['Mercimek, pişmiş',100,20,9,.4],['Zeytinyağı',100,0,0,100],['Elma',100,14,.3,.2],['Muz',100,23,1.1,.3],['Badem',100,22,21,50],['Domates',100,3.9,.9,.2]];function foods(){if(!db.foods.length)db.foods=foodsSeed.map(([name,serving,cho,protein,fat])=>({id:id(),name,serving,cho,protein,fat}));save();let v=$('#view');v.innerHTML=`<div class="heading"><div><h1>Besin Kütüphanesi</h1><div class="sub">Aranabilir besinler. Makrolar 100 g veya listelenen porsiyon içindir; klinik kullanımda etiket/veri kaynağını doğrulayın.</div></div><button class="btn" onclick="foodForm()">＋ Besin Ekle</button></div><div class="card"><div class="toolbar" style="margin-bottom:16px"><input class="search" placeholder="Besin ara" oninput="filterFoods(this.value)"></div><div id="foodtable">${foodRows(db.foods)}</div></div>`}function foodRows(items){return `<div class="tablewrap"><table class="table"><tr><th>Besin</th><th>Porsiyon</th><th>Karbonhidrat</th><th>Protein</th><th>Yağ</th><th>Enerji (4/4/9)</th><th></th></tr>${items.map(f=>`<tr><td><b>${esc(f.name)}</b></td><td>${f.serving} g</td><td>${f.cho} g</td><td>${f.protein} g</td><td>${f.fat} g</td><td>${Math.round(f.cho*4+f.protein*4+f.fat*9)} kcal</td><td><button class="btn light small" onclick="foodForm('${f.id}')">Düzenle</button></td></tr>`).join('')}</table></div>`}function filterFoods(q){$('#foodtable').innerHTML=foodRows(db.foods.filter(f=>f.name.toLowerCase().includes(q.toLowerCase())))}function foodForm(fid){let f=db.foods.find(x=>x.id===fid)||{};modal(`<h2>${fid?'Besini Düzenle':'Besin Ekle'}</h2><form onsubmit="saveFood(event,'${fid||''}')"><div class="fieldgrid">${formFields([['name','Besin adı','text',1],['serving','Porsiyon (g)','number',1],['cho','Karbonhidrat (g)','number',1],['protein','Protein (g)','number',1],['fat','Yağ (g)','number',1]],f)}</div><div class="formactions"><button type="button" class="btn light" onclick="closeModal()">İptal</button><button class="btn">Kaydet</button></div></form>`)}function saveFood(e,fid){e.preventDefault();let o=Object.fromEntries(new FormData(e.target));['serving','cho','protein','fat'].forEach(k=>o[k]=+o[k]);let f=db.foods.find(x=>x.id===fid);f?Object.assign(f,o):db.foods.push({...o,id:id()});save();closeModal();render();toast('Besin kaydedildi.')}
function modal(s){$('#modal').innerHTML=`<div class="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal">${s}</div></div>`}function closeModal(){$('#modal').innerHTML=''}function del(type,i){if(!confirm('Bu kaydı silmek istiyor musunuz?'))return;db[type]=db[type].filter(x=>x.id!==i);save();render()}function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='NutriPeer-yedek-'+iso(new Date())+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),60000);toast('Yedek dosyası indirildi.')}
// Override menu rendering so selected library foods contribute to each meal's live totals.
function iso(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function addMenuFood(i){let food=$('#food-'+i).value,grams=+$('#grams-'+i).value||100;menuItems.push({meal:i,food,grams});renderMeals()}
function applyCalc(){let current=+$('#weight').value,h=+$('#height').value,a=+$('#age').value,gender=$('#sex').value==='Kadın',ideal=22*(h/100)**2,adjusted=ideal+.25*(current-ideal),basis=$('#basis').value,w=basis==='ideal'?ideal:basis==='adjusted'?adjusted:current,g=gender?-161:5;let values={'Mifflin–St Jeor':10*w+6.25*h-5*a+g,'Harris–Benedict (revize)':gender?447.593+9.247*w+3.098*h-4.330*a:88.362+13.397*w+4.799*h-5.677*a,'Schofield (18–30)':(gender?14.818:15.057)*w+(gender?486.6:692.2),'Cunningham':500+22*(+$('#ffm').value||0)};let base=values[$('#chosenEq').value],min=Math.round(base*+$('#actmin').value*+$('#stress').value*(1+ +$('#tef').value/100)),max=Math.round(base*+$('#actmax').value*+$('#stress').value*(1+ +$('#tef').value/100));newDiet(db.patients.find(p=>p.id===$('#cp').value)?.id||'',{min,max,eq:$('#chosenEq').value})}
function saveDiet(e,pid,tid){e.preventDefault();let o=Object.fromEntries(new FormData(e.target)),patient=o.patient||pid,tot=exchangeTotals(),m=tot.m.slice();menuItems.forEach(x=>{let f=db.foods.find(y=>y.id===x.food);if(f)[f.cho,f.protein,f.fat].forEach((z,j)=>m[j]+=z*x.grams/f.serving)});let k=kcal(m);if(!patient){let t={id:tid||id(),name:o.name,note:o.note,kcal:k,ex:{...exchanges},macros:m};let old=db.templates.find(x=>x.id===tid);old?Object.assign(old,t):db.templates.push(t);save();closeModal();render();toast('Şablon kaydedildi.');return}db.diets.push({id:id(),patient,name:o.name,note:o.note,date:iso(new Date()),kcal:k,macros:m,ex:{...exchanges},foods:menuItems.map(x=>({...x}))});save();closeModal();if(page==='profile'){patientTab='Diyet Geçmişi';profile()}else render();toast('Diyet planı danışan dosyasına kaydedildi.')}
function renderMeals(){let el=$('#meals');if(!el)return;let n=menuMeals||4;el.innerHTML=Array.from({length:n},(_,i)=>{let rows=menuItems.filter(x=>x.meal===i),m=[0,0,0];rows.forEach(x=>{let f=db.foods.find(y=>y.id===x.food);if(f)[f.cho,f.protein,f.fat].forEach((z,j)=>m[j]+=z*x.grams/f.serving)});let k=kcal(m);return `<div class="meal"><h3>${['Kahvaltı','Ara Öğün 1','Öğle','Ara Öğün 2','Akşam','Ara Öğün 3'][i]||'Öğün '+(i+1)}</h3><div class="mealstats">${Math.round(k)} kcal · KH ${m[0].toFixed(1)} g (${Math.round(m[0]*4/k*100||0)}%) · Protein ${m[1].toFixed(1)} g (${Math.round(m[1]*4/k*100||0)}%) · Yağ ${m[2].toFixed(1)} g (${Math.round(m[2]*9/k*100||0)}%)</div>${rows.map((x,j)=>{let f=db.foods.find(y=>y.id===x.food);return `<div class="foodrow"><span>${esc(f?.name)} · ${x.grams} g</span><button class="btn light small" type="button" onclick="menuItems.splice(${menuItems.indexOf(x)},1);renderMeals()">Kaldır</button></div>`}).join('')}<div class="foodrow"><select id="food-${i}" class="search">${db.foods.map(f=>`<option value="${f.id}">${esc(f.name)}</option>`).join('')}</select><input id="grams-${i}" class="search" type="number" min="1" value="100" aria-label="Gram"></div><button class="btn light small" type="button" onclick="addMenuFood(${i})">＋ Besin ekle</button></div>`}).join('')}
render();
